# One source tree, three Minecraft lines - so the targets live here as documentation and as the
# version stamped onto the jar, not as a per-line switch.
#
# Which Forge each line is validated against (see docs/VERSIONS.md for the OptiFine side):
#   1.20.x  Forge 47.4.28   (1.20.1-latest), Java 17, ModLauncher 10.0.9, SRG names at runtime
#   1.21.x  Forge 61.2.4    (1.21.11-latest), Java 21, ModLauncher 10.0.9, official names at runtime
#   26.x    Forge 65.1.5    (26.2-latest), Java 25, ModLauncher 10.0.9, official names at runtime
org.gradle.jvmargs=-Xmx2G

# Mod properties. SemVer: 0.1.0 was the skeleton; 0.2.0 is the first version that starts and joins a
# world through the OptiForge pipeline. docs/STATE.md records exactly which lines are measured.
mod_version_base=0.9.0
maven_group=kynarain.cn
archives_base_name=OptiForge

# Compile target. Class file 61 (Java 17) is accepted by every line's runtime, so the release is 17
# even though 1.21.x runs 21 and 26.x runs 25.
java_release=17

# Compile-time APIs only; Forge provides both at runtime.
modlauncher_version=10.0.9
asm_version=9.9.1
